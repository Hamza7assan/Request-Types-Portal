<div [class]="containerClass()">
  <label class="form-label">
    {{ label() }}
    @if (isRequired()) {
      <span class="text-danger ms-1">*</span>
    }
  </label>
  <dx-select-box
    class="custom-dx-input"
    [(value)]="value"
    [dataSource]="options()"
    displayExpr="label"
    valueExpr="value"
    [showClearButton]="allowEmpty() && !emptyDisabled()"
    [placeholder]="''"
    [readOnly]="readOnly()"
    validationMessageMode="auto"
    (onFocusOut)="onBlur()"
    (onClosed)="onBlur()">
    @if (isRequired()) {
      <dx-validator [validationGroup]="validationGroup()" [name]="label()">
        @if (errorMessage()) {
          <dxi-validation-rule type="required" [message]="errorMessage()"></dxi-validation-rule>
        } @else {
          <dxi-validation-rule type="required"></dxi-validation-rule>
        }
      </dx-validator>
    }
  </dx-select-box>
</div>
